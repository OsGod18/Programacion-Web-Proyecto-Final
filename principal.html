<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>STORAGE — Control de Inventario</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Alata&display=swap" rel="stylesheet">
</head>
<body>
  <div class="page-wrapper">
    <!-- HEADER -->
    <header class="app-header">
      <div class="brand">
        <div class="logo">ST</div>
        <h1>STORAGE</h1>
      </div>
      <div class="owner-container">
        <label for="owner">Tu nombre</label>
        <input id="owner" type="text" placeholder="Ej: Juan" />
      </div>
    </header>

    <!-- MAIN (CENTRO) -->
    <main class="app-main">
      <div class="app-grid">
        <!-- PANEL IZQUIERDO: FORMULARIO -->
        <div class="card">
          <h2>Agregar Producto</h2>
          
          <div class="form-group">
            <label for="name">Nombre del producto</label>
            <input id="name" type="text" placeholder="Ej: Arroz" />
          </div>
          
          <div class="form-row">
            <div class="form-group" style="flex:1;">
              <label for="qty">Cantidad</label>
              <input id="qty" type="number" placeholder="Ej: 5" min="1" />
            </div>
            <div class="form-group" style="width:130px;">
              <label for="price">Precio</label>
              <input id="price" type="number" placeholder="Ej: 2000" min="0" />
            </div>
          </div>

          <div class="btn-row">
            <button id="addBtn" class="btn btn-primary">Agregar producto</button>
            <button id="clearBtn" class="btn btn-ghost">Limpiar</button>
          </div>

          <div class="log" id="log">Listo. Bienvenido/a.</div>
        </div>

        <!-- PANEL DERECHO: TABLA E INVENTARIO -->
        <div class="card">
          <div class="card-header-actions">
            <div>
              <span class="subtitle">Inventario</span>
              <h3 class="card-title">Productos</h3>
            </div>
            <div class="action-buttons">
              <input id="search" placeholder="Buscar producto..." class="search-input">
              <button id="calcTotal" class="btn btn-ghost btn-sm">Calcular total</button>
              <button id="exportBtn" class="btn btn-ghost btn-sm">Exportar</button>
            </div>
          </div>

          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Nombre</th>
                  <th>Cant.</th>
                  <th>Precio</th>
                  <th>Total</th>
                  <th>Acción</th>
                </tr>
              </thead>
              <tbody id="tbody">
                <tr><td colspan="6" class="empty">No hay productos — agrega el primero.</td></tr>
              </tbody>
            </table>
          </div>

          <div class="total-box">
            <span>Total del inventario</span>
            <span id="grandTotal">$0</span>
          </div>
        </div>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="app-footer">
      <p>Diseñado y desarrollado por:</p>
      <ul>
        <li>- Omar De la peña</li>
        <li>- Sebastian Buitrago</li>
      </ul>
      <p>Materia: Programacion web</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
